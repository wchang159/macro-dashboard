<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Macro Dashboard</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <style>
        :root{color-scheme:light;--bg-primary:#0a0e27;--bg-secondary:#151932;--bg-card:#1a1f3a;--text-primary:#e8eaf6;--text-secondary:#9fa8da;--border-color:#283593;--green:#00e676;--yellow:#ffd600;--red:#ff1744;--accent:#536dfe}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-primary);color:var(--text-primary);padding:12px;line-height:1.5}
        .container{max-width:1200px;margin:0 auto}
        .header{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:16px;margin-bottom:16px}
        .header h1{font-size:24px;margin-bottom:8px;color:var(--accent)}
        .header-info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--text-secondary)}
        .refresh-btn{background:var(--accent);color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:600}
        .loading{text-align:center;padding:20px;color:var(--text-secondary)}
        .section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:16px;margin-bottom:16px}
        .section-title{font-size:18px;font-weight:600;margin-bottom:12px;color:var(--accent);border-bottom:1px solid var(--border-color);padding-bottom:8px}
        .indicator-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
        .indicator{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:6px;padding:12px}
        .indicator-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
        .indicator-name{font-weight:600;font-size:14px}
        .signal-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
        .signal-green{background:var(--green);box-shadow:0 0 8px var(--green)}
        .signal-yellow{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
        .signal-red{background:var(--red);box-shadow:0 0 8px var(--red)}
        .indicator-value{font-size:20px;font-weight:700;margin:4px 0}
        .indicator-meta{font-size:12px;color:var(--text-secondary)}
        .summary-grid{display:grid;gap:12px}
        .summary-item{background:var(--bg-secondary);border-left:4px solid;padding:12px;border-radius:4px}
        .summary-item.green{border-color:var(--green)}
        .summary-item.yellow{border-color:var(--yellow)}
        .summary-item.red{border-color:var(--red)}
        .summary-item-title{font-weight:600;margin-bottom:6px;font-size:14px}
        .summary-item-text{font-size:13px;color:var(--text-secondary)}
        .error{background:rgba(255,23,68,0.1);border:1px solid var(--red);border-radius:6px;padding:16px;color:var(--red)}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Global Macro Dashboard</h1>
            <div class="header-info">
                <div>
                    <div><strong>Last Updated:</strong> <span id="lastUpdate">Loading...</span></div>
                    <div><strong>Crash Risk Level:</strong> <span id="crashRisk">Analyzing...</span></div>
                </div>
                <button class="refresh-btn" onclick="loadAllData()">🔄 Refresh</button>
            </div>
        </div>
        <div id="loading" class="loading">Loading market data...</div>
        <div id="error" style="display:none"></div>
        <div id="mainContent" style="display:none">
            <div class="section"><div class="section-title">💰 Liquidity & Fed Policy</div><div class="indicator-grid" id="liquidityGrid"></div></div>
            <div class="section"><div class="section-title">📈 Interest Rates & Yield Curve</div><div class="indicator-grid" id="ratesGrid"></div></div>
            <div class="section"><div class="section-title">⚠️ Credit & Risk Spreads</div><div class="indicator-grid" id="creditGrid"></div></div>
            <div class="section"><div class="section-title">📊 Market Volatility</div><div class="indicator-grid" id="volGrid"></div></div>
            <div class="section"><div class="section-title">🏭 Economic Activity</div><div class="indicator-grid" id="econGrid"></div></div>
            <div class="section"><div class="section-title">💱 FX & Commodities</div><div class="indicator-grid" id="fxGrid"></div></div>
            <div class="section"><div class="section-title">📉 Global Equities</div><div class="indicator-grid" id="equityGrid"></div></div>
            <div class="section"><div class="section-title">🚦 Signal Summary</div><div class="summary-grid" id="signalSummary"></div></div>
        </div>
    </div>
    <script>
let marketData={},signals={green:[],yellow:[],red:[]};
const FRED_API='https://api.stlouisfed.org/fred/series/observations',FRED_KEY='a940b255c4e24804abc90248e9c776bb';

async function loadAllData(){
    document.getElementById('loading').style.display='block';
    document.getElementById('mainContent').style.display='none';
    document.getElementById('error').style.display='none';
    signals={green:[],yellow:[],red:[]};
    try{
        await Promise.all([loadYahooData(),loadFREDData()]);
        calculateSignals();
        renderDashboard();
        document.getElementById('lastUpdate').textContent=new Date().toLocaleString();
        document.getElementById('loading').style.display='none';
        document.getElementById('mainContent').style.display='block';
        localStorage.setItem('macroData',JSON.stringify({timestamp:Date.now(),data:marketData}));
    }catch(error){
        console.error('Error:',error);
        document.getElementById('loading').style.display='none';
        document.getElementById('error').innerHTML=`<div class="error"><strong>Error loading data</strong><br>Some data sources unavailable. <button class="refresh-btn" onclick="loadAllData()">Retry</button></div>`;
        document.getElementById('error').style.display='block';
    }
}

async function loadYahooData(){
    const symbols={VIX:{name:'VIX',yahoo:'^VIX'},SPX:{name:'S&P 500',yahoo:'SPY'},DXY:{name:'US Dollar',yahoo:'UUP'},GLD:{name:'Gold',yahoo:'GLD'},COPPER:{name:'Copper',yahoo:'COPX'},OIL:{name:'Oil WTI',yahoo:'USO'},HYG:{name:'HY Credit',yahoo:'HYG'},LQD:{name:'IG Credit',yahoo:'LQD'},DGS2:{name:'US 2Y Yield',yahoo:'^IRX',multiplier:0.1},DGS10:{name:'US 10Y Yield',yahoo:'^TNX',multiplier:0.1}};
    for(const[key,config]of Object.entries(symbols)){
        try{
            const response=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${config.yahoo}`);
            const data=await response.json();
            if(data.chart?.result?.[0]){
                let price=data.chart.result[0].meta.regularMarketPrice;
                if(config.multiplier)price*=config.multiplier;
                marketData[key]={name:config.name,value:price};
                if(key==='SPX'){
                    const quotes=data.chart.result[0].indicators.quote[0];
                    if(quotes?.high){
                        const high52w=Math.max(...quotes.high.filter(v=>v!==null));
                        const drawdown=((price-high52w)/high52w)*100;
                        marketData.SPX_DD={name:'S&P 500 Drawdown',value:drawdown};
                    }
                }
            }
        }catch(e){console.error(`Error ${key}:`,e);marketData[key]={name:config.name,value:null}}
        await new Promise(r=>setTimeout(r,200));
    }
    if(marketData.DGS2?.value&&marketData.DGS10?.value){
        marketData.YIELD_2s10s={name:'Yield Curve (2s10s)',value:marketData.DGS10.value-marketData.DGS2.value};
    }
}

async function loadFREDData(){
    const series={WALCL:'Fed Balance Sheet',M2SL:'M2 Money Supply',RRPONTSYD:'Reverse Repo',WTREGEN:'TGA',UNRATE:'Unemployment',ICSA:'Jobless Claims',CPIAUCSL:'CPI',PPIACO:'PPI'};
    const promises=Object.entries(series).map(async([id,name])=>{
        try{
            const response=await fetch(`${FRED_API}?series_id=${id}&api_key=${FRED_KEY}&file_type=json&sort_order=desc&limit=1`);
            const data=await response.json();
            if(data.observations?.[0]){
                marketData[id]={name:name,value:parseFloat(data.observations[0].value)};
            }
        }catch(e){console.error(`FRED ${id}:`,e);marketData[id]={name:name,value:null}}
    });
    await Promise.all(promises);
}

function calculateSignals(){
    const rules=[
        {k:'VIX',fn:v=>v<15?['yellow','Complacency',`VIX: ${v.toFixed(1)}`]:v<25?['green','Normal',`VIX: ${v.toFixed(1)}`]:v<35?['yellow','Elevated',`VIX: ${v.toFixed(1)}`]:['red','Panic',`VIX: ${v.toFixed(1)}`]},
        {k:'YIELD_2s10s',fn:v=>v<0?['red','Inverted',`Curve: ${v.toFixed(0)}bps`]:v<50?['yellow','Flat',`Curve: ${v.toFixed(0)}bps`]:['green','Normal',`Curve: ${v.toFixed(0)}bps`]},
        {k:'UNRATE',fn:v=>v<4.5?['green','Strong',`Unemp: ${v.toFixed(1)}%`]:v<5.5?['yellow','Softening',`Unemp: ${v.toFixed(1)}%`]:['red','Weak',`Unemp: ${v.toFixed(1)}%`]},
        {k:'HYG',fn:v=>v>78?['green','Healthy',`HYG: $${v.toFixed(2)}`]:v>75?['yellow','Stress',`HYG: $${v.toFixed(2)}`]:['red','Severe',`HYG: $${v.toFixed(2)}`]},
        {k:'LQD',fn:v=>v>105?['green','Stable',`LQD: $${v.toFixed(2)}`]:v>100?['yellow','Tightening',`LQD: $${v.toFixed(2)}`]:['red','Stress',`LQD: $${v.toFixed(2)}`]},
        {k:'SPX_DD',fn:v=>v>=-5?['green','Normal',`DD: ${v.toFixed(1)}%`]:v>=-10?['yellow','Correction',`DD: ${v.toFixed(1)}%`]:v>=-20?['yellow','Deep',`DD: ${v.toFixed(1)}%`]:['red','Bear',`DD: ${v.toFixed(1)}%`]}
    ];
    rules.forEach(r=>{
        const d=marketData[r.k];
        if(d&&d.value!=null){
            const[sig,reason,label]=r.fn(d.value);
            d.signal=sig;d.reason=reason;
            signals[sig].push(label);
        }
    });
    ['WALCL','M2SL','RRPONTSYD','WTREGEN','DGS2','DGS10','SPX','GLD','COPPER','OIL','DXY','ICSA','CPIAUCSL','PPIACO'].forEach(k=>{
        if(marketData[k]&&!marketData[k].signal&&marketData[k].value!=null){
            marketData[k].signal='green';marketData[k].reason='Normal';
        }
    });
}

function renderDashboard(){
    const grids={liquidityGrid:['WALCL','M2SL','RRPONTSYD','WTREGEN'],ratesGrid:['DGS2','DGS10','YIELD_2s10s'],creditGrid:['HYG','LQD'],volGrid:['VIX'],econGrid:['UNRATE','ICSA','CPIAUCSL','PPIACO'],fxGrid:['DXY','GLD','COPPER','OIL'],equityGrid:['SPX','SPX_DD']};
    for(const[grid,keys]of Object.entries(grids)){
        document.getElementById(grid).innerHTML=keys.map(k=>{
            const d=marketData[k];
            if(!d||d.value==null)return '';
            let val=d.value.toFixed(2);
            if(k.includes('WALCL')||k.includes('M2SL'))val='$'+(d.value/1000).toFixed(1)+'T';
            if(k.includes('RRPON')||k.includes('WTRE'))val='$'+(d.value/1000).toFixed(0)+'B';
            if(k.includes('YIELD')||k.includes('DGS')||k.includes('UNRATE')||k.includes('CPI')||k.includes('PPI')||k.includes('DD'))val=d.value.toFixed(2)+'%';
            if(k==='ICSA')val=(d.value/1000).toFixed(0)+'K';
            if(k==='VIX')val=d.value.toFixed(1);
            return`<div class="indicator"><div class="indicator-header"><div class="indicator-name">${d.name}</div><span class="signal-dot signal-${d.signal||'green'}"></span></div><div class="indicator-value">${val}</div><div class="indicator-meta">${d.reason||'Normal'}</div></div>`;
        }).join('');
    }
    const risk=signals.red.length>=3?'High Risk':signals.red.length>=1||signals.yellow.length>=4?'Medium Risk':'Low Risk';
    const color=risk==='High Risk'?'var(--red)':risk==='Medium Risk'?'var(--yellow)':'var(--green)';
    document.getElementById('crashRisk').textContent=risk;
    document.getElementById('crashRisk').style.color=color;
    document.getElementById('signalSummary').innerHTML=`
        <div class="summary-item green"><div class="summary-item-title">🟢 Green (${signals.green.length})</div><div class="summary-item-text">${signals.green.join(' • ')||'None'}</div></div>
        <div class="summary-item yellow"><div class="summary-item-title">🟡 Yellow (${signals.yellow.length})</div><div class="summary-item-text">${signals.yellow.join(' • ')||'None'}</div></div>
        <div class="summary-item red"><div class="summary-item-title">🔴 Red (${signals.red.length})</div><div class="summary-item-text">${signals.red.join(' • ')||'None'}</div></div>
    `;
}

window.addEventListener('load',()=>{
    const cached=localStorage.getItem('macroData');
    if(cached){
        const data=JSON.parse(cached);
        if(Date.now()-data.timestamp<24*60*60*1000){
            marketData=data.data;
            calculateSignals();
            renderDashboard();
            document.getElementById('loading').style.display='none';
            document.getElementById('mainContent').style.display='block';
            document.getElementById('lastUpdate').textContent=new Date(data.timestamp).toLocaleString()+' (cached)';
        }
    }
    loadAllData();
});
    </script>
</body>
</html>
